
name: Testes e Empacotamento Spring Boot

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./aula11devops

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: aula11devops/pom.xml

      - name: Executar testes e empacotar
        run: mvn -B clean package

      - name: Armazenar arquivo JAR
        uses: actions/upload-artifact@v5
        with:
          name: api-produtos
          path: aula11devops/target/*.jar
          if-no-files-found: error
